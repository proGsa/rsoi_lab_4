
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sh: |
    #!/usr/bin/env bash
    set -e
    export PGPASSWORD="$POSTGRES_PASSWORD"

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -f /init-scripts/10-create-user.sql

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -f /init-scripts/db-v4.sql

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d libraries \
      -f /init-scripts/libraries.sql

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d reservations \
      -f /init-scripts/reservations.sql

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d ratings \
      -f /init-scripts/ratings.sql

  10-create-user.sql: |
    CREATE ROLE program WITH PASSWORD 'test';
    ALTER ROLE program WITH LOGIN;

  db-v4.sql: |
    CREATE DATABASE reservations;
    GRANT ALL PRIVILEGES ON DATABASE reservations TO program;

    CREATE DATABASE libraries;
    GRANT ALL PRIVILEGES ON DATABASE libraries TO program;

    CREATE DATABASE ratings;
    GRANT ALL PRIVILEGES ON DATABASE ratings TO program;

  libraries.sql: |
    CREATE TABLE library (
        id SERIAL PRIMARY KEY,
        library_uid UUID UNIQUE NOT NULL,
        name VARCHAR(80) NOT NULL,
        city VARCHAR(255) NOT NULL,
        address VARCHAR(255) NOT NULL
    );

    CREATE TABLE books (
        id SERIAL PRIMARY KEY,
        book_uid UUID UNIQUE NOT NULL,
        name VARCHAR(255) NOT NULL,
        author VARCHAR(255),
        genre VARCHAR(255),
        condition VARCHAR(20) DEFAULT 'EXCELLENT'
            CHECK (condition IN ('EXCELLENT', 'GOOD', 'BAD'))
    );

    CREATE TABLE library_books (
        book_id INT REFERENCES books(id),
        library_id INT REFERENCES library(id),
        available_count INT NOT NULL
    );

    INSERT INTO library (library_uid, name, city, address)
    VALUES (
        '83575e12-7ce0-48ee-9931-51919ff3c9ee',
        'Библиотека имени 7 Непьющих',
        'Москва',
        '2-я Бауманская ул., д.5, стр.1'
    );

    INSERT INTO books (book_uid, name, author, genre, condition)
    VALUES (
        'f7cdc58f-2caf-4b15-9727-f89dcc629b27',
        'Краткий курс C++ в 7 томах',
        'Бьерн Страуструп',
        'Научная фантастика',
        'EXCELLENT'
    );

    INSERT INTO library_books (book_id, library_id, available_count)
    VALUES (1, 1, 1);

    GRANT USAGE ON SCHEMA public TO program;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO program;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO program;

  reservations.sql: |
    CREATE TABLE reservation (
        id SERIAL PRIMARY KEY,
        reservation_uid UUID UNIQUE NOT NULL,
        username VARCHAR(80) NOT NULL,
        book_uid UUID NOT NULL,
        library_uid UUID NOT NULL,
        status VARCHAR(20) NOT NULL
            CHECK (status IN ('RENTED', 'RETURNED', 'EXPIRED')),
        start_date TIMESTAMP NOT NULL,
        till_date TIMESTAMP NOT NULL
    );

    GRANT USAGE ON SCHEMA public TO program;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO program;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO program;

  ratings.sql: |
    CREATE TABLE rating (
        id SERIAL PRIMARY KEY,
        username VARCHAR(80) NOT NULL,
        stars INT NOT NULL CHECK (stars BETWEEN 0 AND 100)
    );

    INSERT INTO rating (username, stars) VALUES ('test', 5);
    INSERT INTO rating (username, stars) VALUES ('Test Max', 75);

    GRANT USAGE ON SCHEMA public TO program;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO program;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO program;
