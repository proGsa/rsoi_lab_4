name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Install dependencies
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          pip install -r v4/library_service/requirements.txt
          pip install -r v4/reservation_service/requirements.txt
          pip install -r v4/rating_service/requirements.txt
          pip install -r v4/gateway_service/requirements.txt
          pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest v4/library_service/tests
          pytest v4/reservation_service/tests
          pytest v4/rating_service/tests

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          docker compose config
          docker compose build
          docker compose push

      - name: Verify published images
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for image in library-service reservation-service rating-service gateway-service; do
            echo "Checking progsa/$image:$IMAGE_TAG"
            docker buildx imagetools inspect "progsa/$image:$IMAGE_TAG"
          done

  deploy-and-newman:
    name: Deploy and Newman
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      NAMESPACE: test
      VARIANT: v4
      DEPLOYMENT_NAME: rating
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_SECRET_ID: ${{ secrets.CLOUDRU_SECRET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Install cloudlogin
        run: |
          curl -fsSLO \
            https://github.com/cloud-ru-tech/cloudlogin/releases/latest/download/cloudlogin_Linux_amd64.tar.gz
          tar -xzf cloudlogin_Linux_amd64.tar.gz
          sudo install -m 0755 cloudlogin /usr/local/bin/cloudlogin
          cloudlogin help

      - name: Configure Kubernetes
        env:
          KUBECONFIG_RAW: ${{ secrets.KUBECONFIG }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET_ID: ${{ secrets.CLOUDRU_SECRET_ID }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_RAW" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          ruby -ryaml -e '
            path = ENV.fetch("HOME") + "/.kube/config"
            config = YAML.load_file(path)

            config.fetch("users").each do |entry|
              exec = entry.dig("user", "exec")
              next unless exec && exec["command"] == "cloudlogin"

              exec["env"] ||= []
              %w[CLOUDRU_KEY_ID CLOUDRU_SECRET_ID].each do |name|
                exec["env"].reject! { |item| item["name"] == name }
              end

              exec["env"] << {
                "name" => "CLOUDRU_KEY_ID",
                "value" => ENV.fetch("CLOUDRU_KEY_ID")
              }
              exec["env"] << {
                "name" => "CLOUDRU_SECRET_ID",
                "value" => ENV.fetch("CLOUDRU_SECRET_ID")
              }
            end

            File.write(path, config.to_yaml)
          '

          chmod 600 "$HOME/.kube/config"
          export KUBECONFIG="$HOME/.kube/config"
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Create test namespace
        run: kubectl create namespace test --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres k8s/postgres \
            -n "$NAMESPACE" --wait --timeout 3m

      # - name: Check database data
      #   run: |
      #     set -e

      #     echo "=== Libraries ==="
      #     kubectl exec -n "$NAMESPACE" deployment/postgres -- \
      #       psql -U program -d libraries -c \
      #       "SELECT * FROM library;"

      #     echo "=== Books ==="
      #     kubectl exec -n "$NAMESPACE" deployment/postgres -- \
      #       psql -U program -d libraries -c \
      #       "SELECT * FROM books;"

      #     echo "=== Library-book links ==="
      #     kubectl exec -n "$NAMESPACE" deployment/postgres -- \
      #       psql -U program -d libraries -c \
      #       "SELECT * FROM library_books;"

      #     echo "=== Reservations ==="
      #     kubectl exec -n "$NAMESPACE" deployment/postgres -- \
      #       psql -U program -d reservations -c \
      #       "SELECT * FROM reservation;"

      #     echo "=== Ratings ==="
      #     kubectl exec -n "$NAMESPACE" deployment/postgres -- \
      #       psql -U program -d ratings -c \
      #       "SELECT * FROM rating;"

      - name: Deploy services
        timeout-minutes: 20
        run: |
          for service in library rating reservation gateway; do
            echo "=== Deploying $service ==="

            if ! helm upgrade --install "$service" k8s/service \
              -n "$NAMESPACE" \
              -f "k8s/values/$service.yaml" \
              --set image.tag="$IMAGE_TAG" \
              --wait --timeout 5m; then

              echo "=== Pods ==="
              kubectl get pods -n "$NAMESPACE" -o wide

              echo "=== Deployments ==="
              kubectl get deployments -n "$NAMESPACE"

              echo "=== Recent events ==="
              kubectl get events -n "$NAMESPACE" \
                --sort-by=.metadata.creationTimestamp

              echo "=== Library pod description ==="
              kubectl describe pods -n "$NAMESPACE" \
                -l app.kubernetes.io/name=library

              exit 1
            fi
          done
          
      - name: Wait for services
        run: |
          for service in library rating reservation gateway; do
            kubectl rollout status deployment/"$service" \
              -n "$NAMESPACE" --timeout=180s
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Forward gateway port
        run: |
          kubectl port-forward svc/gateway 8080:8080 \
            -n "$NAMESPACE" > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/manage/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          exit 1

      - name: Reset test data
        run: |
          set -e

          kubectl exec -n "$NAMESPACE" deployment/postgres -- \
            psql -U program -d libraries -c \
            "UPDATE library_books SET available_count = 1
            WHERE library_id = 1 AND book_id = 1;"

          kubectl exec -n "$NAMESPACE" deployment/postgres -- \
            psql -U program -d reservations -c \
            "DELETE FROM reservation
            WHERE username = 'Test Max';"

          kubectl exec -n "$NAMESPACE" deployment/postgres -- \
            psql -U program -d ratings -c \
            "UPDATE rating SET stars = 77
            WHERE username = 'Test Max';"

      # - name: Run Newman fault-tolerance scenario
      #   run: |
      #     chmod +x ./scripts/test-script.sh
      #     ./scripts/test-script.sh v4 rating test
      
      # - name: Debug Kubernetes after tests
      #   if: always()
      #   run: |
      #     echo "=== Pods ==="
      #     kubectl get pods -n test -o wide

      #     echo "=== Rating Service endpoints ==="
      #     kubectl get endpoints rating -n test

      #     echo "=== Rating Service ==="
      #     kubectl get service rating -n test

      #     echo "=== Reservation logs ==="
      #     kubectl logs deployment/reservation -n "$NAMESPACE" --tail=100

      #     echo "=== Gateway environment ==="
      #     kubectl exec deployment/gateway -n "$NAMESPACE" -- \
      #       printenv | grep -E 'RATING_SERVICE_URL|RESERVATION_SERVICE_URL|LIBRARY_SERVICE_URL'

      #     echo "=== Gateway logs ==="
      #     kubectl logs deployment/gateway -n test --tail=50

      # - name: Wait before services are ready
      #   run: kubectl wait -n test -l app.kubernetes.io/name=gateway pod --for=condition=Ready --timeout 3m
      
      # - name: Install newman
      #   run: npm install -g newman
      # TODO setup parameters in classroom/autograding.json
      
      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET_ID: ${{ secrets.CLOUDRU_SECRET_ID }}
          KUBECONFIG: ${{ env.KUBECONFIG }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}